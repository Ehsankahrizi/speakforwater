###############################################################################
#  SpeakForWater — Audit Sheet (manual, READ-ONLY)
#
#  Dumps the queue (data/queue.json) structure (rows, episode numbers, statuses,
#  duplicates, blank rows) so we can plan a cleanup. Makes NO changes.
#
#  Trigger from: Actions -> Audit Sheet -> Run workflow, then read the log.
###############################################################################

name: Audit Sheet

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit queue (data/queue.json)
        run: python scripts/audit_sheet.py
