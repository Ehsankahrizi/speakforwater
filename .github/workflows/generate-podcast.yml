###############################################################################
#  SpeakForWater — Weekday Podcast Generator
#
#  This workflow runs at 08:00 America/Chicago Monday-Friday, publishing ONE
#  episode per run:
#    1. Reads the next queued paper URL from your Google Sheet
#    2. Uses notebooklm-py SDK to automate NotebookLM (no browser needed)
#    3. Downloads the generated podcast MP3
#    4. Commits it to this repo (triggers GitHub Pages rebuild)
#    5. Updates the RSS feed for Spotify / Apple Podcasts
#    6. Marks the episode as published in Google Sheets
#
#  Required secrets (set in repo Settings → Secrets → Actions):
#    GOOGLE_CREDENTIALS_JSON  — Service account JSON for Google Sheets
#    SPREADSHEET_ID           — Your Google Sheet ID
#    NOTEBOOKLM_AUTH_JSON     — Contents of ~/.notebooklm/profiles/default/
#                               storage_state.json after `notebooklm login`.
#                               ('notebooklm auth export' does not exist.)
#                               See SPEAKFORWATER_HANDOFF.md -> "Refresh
#                               NotebookLM auth" for the full procedure.
#    SITE_URL                 — e.g. https://ehsankahrizi.github.io/speakforwater
###############################################################################

name: Generate Podcast

on:
  # ── Weekday schedule ───────────────────────────────────────────────
  schedule:
    # Target: 08:00 America/Chicago, one episode per weekday.
    #
    # GitHub cron is UTC-only and knows nothing about daylight saving, so no
    # single entry hits 8 AM Central all year: 8 AM CST is 14:00 UTC, 8 AM CDT
    # is 13:00 UTC. Both fire, and the `gate` job below drops whichever one is
    # not 08:00 in Chicago that day. Net effect is exactly one run per weekday,
    # at 8 AM local, across the DST switch.
    #
    # Each run publishes exactly one episode, so the number of surviving cron
    # hits IS the number of episodes per day. ("0 6,12,18 * * *" was three a
    # day, every day.) 1-5 is Mon-Fri; at 13-14 UTC the Chicago date is the
    # same day, so no weekday drifts across the boundary.
    - cron: "0 13,14 * * 1-5"

  # ── Manual trigger (for testing) ───────────────────────────────────
  workflow_dispatch:
    inputs:
      paper_url:
        description: "Override: paper URL (leave empty to read from Sheet)"
        required: false
        type: string
      paper_title:
        description: "Override: paper title"
        required: false
        type: string
      episode_number:
        description: "Override: episode number"
        required: false
        type: number

# Prevent concurrent runs (only one podcast at a time)
concurrency:
  group: podcast-generation
  cancel-in-progress: false

permissions:
  contents: write  # Needed to push MP3 + metadata commits

jobs:
  # Only one of the two scheduled hours is really 08:00 in Chicago on any given
  # day; this drops the other. Skipped (not failed), so the DST twin never
  # sends a failure notification. Manual runs always pass.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check it is 08:00 in Chicago
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding regardless of the clock."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/Chicago date +%H)
          if [ "$hour" = "08" ]; then
            echo "Chicago local time is 08:00 — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Chicago local time is ${hour}:00, not 08:00 — DST twin run, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Podcast generation can take 15-25 min

    steps:
      # ── Checkout repo ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup Python ────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Cache pip dependencies ──────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Install ffmpeg (for intro/outro stitching) ────────────────
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Montserrat fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-montserrat ||           (mkdir -p ~/.fonts && cd ~/.fonts &&            wget -q https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf &&            wget -q https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-SemiBold.ttf &&            sudo mkdir -p /usr/share/fonts/truetype/montserrat &&            sudo cp ~/.fonts/Montserrat-*.ttf /usr/share/fonts/truetype/montserrat/ &&            sudo fc-cache -f)


      # ── Install dependencies ────────────────────────────────────
      - name: Install Python dependencies
        run: |
          # requirements.txt is the single source of truth. Do NOT re-install
          # notebooklm-py unpinned here — that is how CI silently drifted onto a
          # different major version than the machine that minted the auth cookies.
          pip install -r requirements.txt
          pip freeze | grep -i notebooklm || true   # log the resolved version

      # ── Create episodes directory if needed ─────────────────────
      - name: Ensure episodes directory exists
        run: mkdir -p episodes

      # ── Run the pipeline ────────────────────────────────────────
      - name: Generate podcast episode
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Cover layout (tuned by trial & error)
          TITLE_PX_X1: "219"
          TITLE_PX_Y1: "140"
          TITLE_PX_X2: "1006"
          TITLE_PX_Y2: "480"
          TITLE_FONT_MAX: "52"
          EP_FONT_MAX: "34"
          EP_CENTER_X: "613"
          EP_CENTER_Y: "545"
          # Episode label color + decorative rules ( —— EPISODE N —— )
          EP_COLOR: "#1565A0"
          EP_RULE_COLOR: "#8FB9DD"
          EP_RULE_LEN: "100"
          EP_RULE_GAP: "26"
          EP_RULE_WIDTH: "3"
          # Groq Llama — short, listener-friendly cover titles
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_ENABLED: ${{ vars.YOUTUBE_ENABLED }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          # Legacy fallback
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_NAME: ${{ secrets.SHEET_NAME || 'Sheet1' }}
          # Cloudflare R2 media hosting (audio uploaded here; feed points here)
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          PODCAST_OWNER_EMAIL: ${{ vars.PODCAST_OWNER_EMAIL || 'kahriziehsan490@gmail.com' }}
          # Pass manual overrides if provided
          MANUAL_PAPER_URL: ${{ inputs.paper_url }}
          MANUAL_PAPER_TITLE: ${{ inputs.paper_title }}
          MANUAL_EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: python run_pipeline.py
        # Episodes are uploaded to Cloudflare R2 by the pipeline, so we no
        # longer back them up as Actions artifacts (that filled the 2 GB
        # Actions storage quota with redundant ~250 MB MP3s every run).
