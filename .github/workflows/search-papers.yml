###############################################################################
#  SpeakForWater — Weekday Paper Search
#
#  Runs each weekday to find new open-access water research papers and add
#  them to the Google Sheet queue. Searches MULTIPLE sources in parallel
#  (OpenAlex + Semantic Scholar) — not locked to a technical-journal
#  whitelist — so stakeholder-relevant research surfaces, then an AI
#  ranker keeps only the plain-language, real-world-relevant ones.
#
#  Queries:  config/keywords.yml  (stakeholder-oriented, edit any time)
#
#  Required secrets:
#    GOOGLE_CREDENTIALS_JSON  — Service account JSON for Google Sheets
#    SPREADSHEET_ID           — Your Google Sheet ID
###############################################################################

name: Search Papers

on:
  # ── Weekday schedule (best effort; see below) ────────────────
  schedule:
    # Weekdays only, matching generate-podcast.yml: papers are queued on the
    # days episodes are actually published, so the queue does not grow over
    # weekends with nothing consuming it. At MAX_PAPERS=2 that is 10 queued a
    # week against 5 consumed — the ~5/week margin covers papers that later
    # fail at the download or content-validation stage.
    #
    # 04:00 UTC is an intent, not an ordering guarantee. This workflow does NOT
    # reliably run before the day's episode: GitHub delivers scheduled runs when
    # it has capacity, and these landed at 15:06 and 16:30 UTC on 2026-08-27/28
    # — after the 13:00/14:00 publish window they were supposed to precede.
    #
    # Nothing depends on winning that race. The sheet is a buffer several days
    # deep, so an episode draws on papers queued days ago and a late (or
    # skipped) search costs nothing. Do not add logic that assumes this ran
    # first; keep the buffer deep enough that it never matters.
    - cron: "0 4 * * 1-5"  # 04:00 UTC, Mon-Fri — best effort, see above

  # ── Manual trigger ───────────────────────────────────────────
  workflow_dispatch:
    inputs:
      max_papers:
        description: "Max papers to queue (default 2)"
        required: false
        type: number
        default: 2
      num_queries:
        description: "Stakeholder queries to run per pass (default 6)"
        required: false
        type: number
        default: 6
      years_back:
        description: "Only keep papers from the last N years (default 5)"
        required: false
        type: number
        default: 5

concurrency:
  group: paper-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pyyaml gspread google-auth groq

      - name: Search for papers
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME || 'Sheet1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # No RANKER_MODEL override here on purpose. This line used to pin
          # llama-3.1-8b-instant, which Groq has since retired; every ranking
          # call 404'd and the run reported success having queued nothing, for
          # at least eight consecutive runs. paper_ranker.py's own default is
          # both current and a better judge of topic fit, and it now verifies
          # the model exists before scoring, so a future retirement fails the
          # build instead of quietly emptying the queue.
          RANKER_THRESHOLD: "7.0"
          # ── Multi-source, stakeholder-oriented search ──────────
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SEARCH_SOURCES: "openalex,semantic_scholar,scopus"
          OPENALEX_MAILTO: kahriziehsan490@gmail.com   # polite pool (faster/reliable)
          UNPAYWALL_EMAIL: kahriziehsan490@gmail.com
          AGGREGATE_TIMEOUT: "90"
          NUM_QUERIES: ${{ inputs.num_queries || '6' }}
          PER_SOURCE: "6"
          YEARS_BACK: ${{ inputs.years_back || '5' }}
          # Sized against consumption, not against how many good papers exist.
          # generate-podcast.yml publishes one episode per weekday, so queueing
          # 10 a day grew the backlog by ~65 papers a week and buried fresh
          # research behind a queue months long.
          MAX_PAPERS: ${{ inputs.max_papers || '2' }}
        run: python search_papers.py
