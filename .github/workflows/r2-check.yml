name: R2 connectivity check

# One-off sanity check: verifies the R2_* secrets can actually authenticate
# and write to the bucket, without running the full ~85-minute podcast job.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3

      - name: Test R2 upload + delete
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os, boto3
          from botocore.config import Config

          acct = os.environ["R2_ACCOUNT_ID"]
          bucket = os.environ["R2_BUCKET"]
          key = "_healthcheck/r2-check.txt"

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{acct}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4"),
          )

          print(f"Uploading test object to bucket '{bucket}'...")
          s3.put_object(Bucket=bucket, Key=key, Body=b"ok", ContentType="text/plain")
          print("✓ Upload succeeded — credentials are valid and can write.")

          s3.delete_object(Bucket=bucket, Key=key)
          print("✓ Cleaned up test object.")
          print("R2 IS WORKING.")
          PY
