# ─────────────────────────────────────────────────────────────
# SpeakForWater — Podcast Prompt
#
# TWO HARD CONSTRAINTS. Please read before editing.
#
# 1. LENGTH. app/services/notebooklm.py sends only the first
#    PROMPT_MAX_CHARS characters. The previous version of this file was
#    5,932 chars against a 2,000 cap, so two thirds of it — every style
#    rule and the whole back half of the structure — was silently thrown
#    away and never reached NotebookLM. Keep this prompt under the cap;
#    tests/test_prompt.py fails if it grows past. Prefer deleting an
#    example over adding one.
#
# 2. NO NAMES, NO GENDER. NotebookLM picks the two TTS voices itself and
#    exposes no voice/speaker control at any layer (verified 2026-08-06:
#    no such parameter in the CLI, the Python API, or the library). It
#    also ignores instructions like "the host must sound female" — an
#    earlier prompt shouted that in capitals and the voices still came
#    out swapped.
#
#    So the script never says a name and never asserts a gender. Two
#    unnamed voices cannot be mismatched to a name, which makes the
#    problem structurally impossible instead of merely unlikely. Do NOT
#    reintroduce "Anna"/"Ehsan" into the spoken script.
#
#    The solo open is kept deliberately: one voice speaking alone first
#    is the best available heuristic for how NotebookLM assigns voices.
#    It is a nudge, not a guarantee — which is exactly why nothing in
#    the audio depends on it landing.
# ─────────────────────────────────────────────────────────────

show_name: "SpeakForWater"
# Roles, not people. See constraint 2 above before adding names here.
host_role: "host"
guest_role: "water-resources researcher"

prompt: |
  One episode of the podcast "SpeakForWater".

  CAST — two speakers, identified only by role:
    HOST — presents the show, guides it, asks the questions.
    EXPERT — a water researcher, does the explaining.
  NO NAMES. Neither speaker is ever named, introduces themselves by
  name, or addresses the other by name; invent no names. Never state
  or imply their gender or use gendered pronouns for them — say "my
  guest", "our expert", "the host".

  AUDIENCE — ordinary people, not scientists: farmers, residents,
  utility and irrigation workers, policy-makers. No technical
  background. Explain as if to a neighbour over coffee.

  SOURCES — use ONLY the paper(s) in this notebook. If a detail is
  absent, say "The paper does not mention that." Never invent
  statistics, places, methods, or results.

  STRUCTURE
    1. OPEN — the host ALONE, no guest yet: welcome listeners to
       SpeakForWater like a news anchor, then tease the topic in 2–3
       sentences without giving away findings. Vary this each episode.
    2. The host brings in the expert by role; the expert greets back.
    3. WHY IT MATTERS — the real problem, one everyday example.
    4. WHAT THEY DID — 2–3 sentences, no methods or models.
    5. FINDINGS — 3–5. Each: expert states it, host asks what it
       means for real people, expert gives the consequence.
    6. TAKEAWAYS — 3–5 a farmer, manager, or resident could act on.
    7. LIMITATIONS — 2–3 specific ones from the paper.
    8. CLOSE — host summarises in ~3 sentences, expert adds one "if
       you remember one thing" line, host signs off.

  STYLE — 6–10 minutes. Warm, upbeat, conversational. Let the roles
  carry it: the host asks, the expert explains. Define each technical
  term the first time in one plain sentence; skip methodology —
  listeners care about their farm, their city, their water bill. Tie
  findings to real consequences. Use contractions, vary sentence
  length, allow small human moments (a pause, mild surprise, "yeah,
  exactly").
