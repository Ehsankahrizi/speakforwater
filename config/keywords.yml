# ─────────────────────────────────────────────────────────────
# SpeakForWater — Search Queries (stakeholder-oriented)
#
# These are natural-language queries used to find water research that
# matters to real water users — farmers, households, villages, local
# agencies, industry, and the general public — rather than narrow,
# highly technical modeling papers.
#
# They are passed to a multi-source search (OpenAlex + Semantic Scholar),
# then an AI ranker (paper_ranker.py) keeps only the ones that can be
# explained in plain language with a clear "so what" for everyday people.
#
# A few queries are picked at random each run so results stay varied.
# Phrase them the way you'd describe the topic to a non-scientist —
# the broader the everyday framing, the more stakeholder-relevant the hits.
# ─────────────────────────────────────────────────────────────

keywords:
  # ── Drinking water & communities ──────────────────────────
  - access to safe drinking water in rural communities
  - drinking water quality and public health
  - water affordability and household water bills
  - water supply security for small towns and villages
  - lead and contaminants in tap water
  - safe water access in developing regions

  # ── Farmers & agriculture ─────────────────────────────────
  - irrigation water management for smallholder farmers
  - improving water use efficiency on farms
  - drought impact on farmers and crops
  - groundwater depletion affecting agriculture
  - water-saving irrigation technology for farmers
  - sustainable groundwater for irrigation

  # ── Drought, floods & climate ─────────────────────────────
  - drought preparedness for communities
  - flooding risk in cities and neighborhoods
  - climate change effects on local water supply
  - protecting communities from water shortages
  - managing water during drought

  # ── Quality, pollution & health ───────────────────────────
  - water pollution and community health
  - cleaning up contaminated groundwater
  - protecting rivers and lakes that people depend on
  - wastewater reuse and recycling for cities

  # ── Governance, economy & industry ────────────────────────
  - fair water allocation between farms cities and industry
  - water management policy for local agencies
  - water use in industry and the economy
  - community water conservation programs
  - rainwater harvesting for households and farms

  # ── Coastal & special cases ───────────────────────────────
  - saltwater intrusion threatening coastal water supply
  - sea level rise and freshwater supplies

  # ── Emerging contaminants & health ────────────────────────
  - PFAS forever chemicals in drinking water
  - arsenic contamination in well water
  - fluoride levels in community water supplies
  - nitrate pollution in rural drinking water
  - microplastics in tap and bottled water
  - removing pharmaceuticals from wastewater

  # ── Water technology & innovation ─────────────────────────
  - low-cost water filters for households
  - solar-powered water pumping for villages
  - desalination for drinking water supply
  - smart water meters and leak detection
  - membrane technology for clean water
  - point-of-use water treatment at home

  # ── Infrastructure & supply systems ───────────────────────
  - aging water pipes and distribution losses
  - reducing water leakage in city networks
  - safety of small dams and reservoirs
  - maintaining rural water supply systems
  - water storage tanks for dry seasons

  # ── Ecosystems & nature-based solutions ───────────────────
  - wetlands protecting water quality
  - restoring rivers for clean water
  - watershed protection for drinking water
  - green infrastructure for stormwater
  - protecting springs and natural water sources

  # ── Equity, access & resilience ───────────────────────────
  - water access for informal settlements and slums
  - women and water collection in rural areas
  - schools and clean water and sanitation
  - water security for indigenous communities
  - emergency water supply after disasters
  - heatwaves and urban water demand
